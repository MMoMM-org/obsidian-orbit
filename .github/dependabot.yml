version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR per week for all low-risk bumps.
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Majors stay ungrouped so each lands in its own reviewable PR.
    ignore:
      # CodeMirror must match the exact versions the Obsidian app ships;
      # obsidian's own peerDependencies pin them. Bumping causes a second
      # CodeMirror copy and type mismatches, so never auto-update these.
      - dependency-name: "@codemirror/state"
      - dependency-name: "@codemirror/view"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types:
          - minor
          - patch
